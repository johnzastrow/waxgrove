name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      # -race needs cgo, so this job re-enables it only for the test step.
      - name: Test
        run: go test -race ./...
        env:
          CGO_ENABLED: 1

      - name: Build
        run: go build -trimpath ./...

      - name: Cross-compile for Raspberry Pi (N1)
        run: GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/waxgrove

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
